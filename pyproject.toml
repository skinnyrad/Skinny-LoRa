[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skinny-lora"
dynamic = ["version"]
description = "Terminal application for transmitting and receiving LoRa traffic with an Adafruit Feather RFM95"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "prompt_toolkit>=3.0.38,<4",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
skinny-lora = "skinny_lora.cli:main"

[tool.setuptools]
packages = ["skinny_lora"]

[tool.setuptools.dynamic]
version = {attr = "skinny_lora.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
